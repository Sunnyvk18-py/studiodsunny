name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunny_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sunny_migrations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Pytest (merge path; excl. migrations/fuzz)
        # Fuzz stays on nightly — push CI must stay well under ~5 minutes.
        run: .venv/bin/python -m pytest -q -m "not migrations and not fuzz" --durations=15
      - name: Migration suite must PASS (not skip)
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -m migrations -v --tb=short | tee /tmp/migrations.log
          # Sabotage trap: a bad services: postgres block must not look green via skips.
          grep -E 'test_round_trip_upgrade_downgrade_upgrade PASSED' /tmp/migrations.log
          grep -E 'test_model_drift_autogenerate_empty PASSED' /tmp/migrations.log
          grep -E 'test_upgrade_over_prod_shape_preserves_rows PASSED' /tmp/migrations.log
          if grep -E 'SKIPPED' /tmp/migrations.log; then
            echo "::error::Migration tests skipped under CI — fix MIGRATION_DATABASE_URL / Postgres service"
            exit 1
          fi
      - name: OpenAPI export (schema smoke)
        run: .venv/bin/python -m scripts.export_openapi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_sunny_hq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/studio_sunny_hq
      CORS_ORIGINS: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps + seed
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m app.seed.seed --demo
      - name: Start API
        working-directory: backend
        run: |
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to become ready"
          exit 1
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Next
        working-directory: frontend
        run: |
          npm run build
          npm run start -- --port 3000 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Next failed to become ready"
          exit 1
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: Playwright
        working-directory: frontend
        # login.spec is the CI smoke that proves API+Next+cookies. Broader flows stay local until stable.
        run: npx playwright test e2e/login.spec.ts
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
