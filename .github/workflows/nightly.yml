name: Nightly

# Deep Schemathesis belongs off the merge path — keep push CI under ~5 minutes.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:

jobs:
  fuzz-deep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Schemathesis (default + deep)
        run: .venv/bin/python -m pytest -m fuzz --fuzz-deep -q --tb=line
        env:
          FUZZ_DEEP: "1"
