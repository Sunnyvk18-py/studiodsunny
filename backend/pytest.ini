# Pytest markers for Studio Sunny HQ
[pytest]
markers =
    migrations: Postgres/testcontainers migration safety suite (needs Docker)
    fuzz: Schemathesis OpenAPI fuzz suite
    hostile: Hostile seed + render/performance suite
    fuzz_exclude: Documented exclusion from Schemathesis (reason required in mark)
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
